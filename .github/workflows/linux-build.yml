name: Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-linux:
    name: Build Linux Packages (AppImage & deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            patchelf \
            libfuse2 \
            fuse \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Import Signing Key File
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.tauri
          INPUT_VAL="${KEY_B64:-$KEY_RAW}"

          if [ -z "$INPUT_VAL" ]; then
            echo "ERROR: Neither TAURI_SIGNING_PRIVATE_KEY_B64 nor TAURI_SIGNING_PRIVATE_KEY secret is configured in GitHub repository settings!"
            exit 1
          fi

          if echo "$INPUT_VAL" | grep -q "^untrusted comment:"; then
            echo "$INPUT_VAL" > ~/.tauri/timebound-v2.key
          else
            echo "$INPUT_VAL" | base64 -d > ~/.tauri/timebound-v2.key 2>/dev/null || echo "$INPUT_VAL" > ~/.tauri/timebound-v2.key
          fi

          echo "TAURI_SIGNING_PRIVATE_KEY=/home/runner/.tauri/timebound-v2.key" >> $GITHUB_ENV

      - name: Build Linux AppImage and Debian package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles appimage,deb




      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timebound-linux-packages
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.tar.gz.sig
            src-tauri/target/release/bundle/deb/*.deb

