[package]
name = "spydy-reminder"
version = "0.1.0"
description = "A Windows desktop reminder application"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.6", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
